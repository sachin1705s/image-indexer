[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-archive-search"
version = "0.1.1"
description = "Local-first creative image archive search with SQLite, FAISS, FastAPI, and Typer."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "OpenAI Codex" }]
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "faiss-cpu>=1.8.0",
  "httpx>=0.27.0,<1.0.0",
  "numpy>=1.26.0,<3.0.0",
  "pillow>=10.4.0,<12.0.0",
  "PyYAML>=6.0.2,<7.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "torch>=2.4.0,<3.0.0",
  "tqdm>=4.66.0,<5.0.0",
  "transformers>=4.46.0,<5.0.0",
  "typer>=0.12.5,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[project.scripts]
image-archive = "image_archive.cli:app"
image-archive-search = "image_archive.cli:app"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
image_archive = ["frontend/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
